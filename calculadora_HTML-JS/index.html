<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="arquivo.js" defer></script>
</head>
<body>

    <h1>Calculadora HTML</h1>
    <input id="num1" type="number" placeholder="Digite o primeiro número...">
    <input id="num2" type="number" placeholder="Digite o segundo número...">
    <p>Digite uma operação: [+],[-],[*],[/]<br></p>
    <input id="op" type="text" placeholder="Digite a operação...">
    <p></p>
    <button id="botao">obter resultado</button>
    <h2>Resultado:</h2>
    <p id="resultado"></p>
</body>
</html>
